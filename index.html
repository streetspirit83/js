<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- ════════════════════════════════════════════════
     § 0  DESIGN TOKENS
     ════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#FFFFFF;
  --text:#00171F;
  --accent:#00A8E8;
  --highlight-neg:#EF4242;
  --highlight-pos:#43ca43;
  --surface:#E9E7E7;

  --radius:4px;

  --font-sans:'DM Sans',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,monospace;

  /* ── 4 Schriftgrößen ── */
  --fs-xl:22px;   /* Brand-Titel */
  --fs-l: 16px;   /* Body, Buttons */
  --fs-s: 13px;   /* Labels, Meta */
  --fs-xs:11px;   /* Sekundär, Stats, Badges */

  --fw-bold:700;
  --fw-mid: 500;
  --fw-light:300;

  --gap:2px;
  --pad:8px;
  --nav-h:45px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-sans);font-size:var(--fs-l);font-weight:var(--fw-bold);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + 56px + env(safe-area-inset-bottom));
}

button,select{
  font-family:inherit;font-size:var(--fs-l);font-weight:var(--fw-bold);
  color:var(--text);background:var(--surface);
  border:0;border-radius:var(--radius);
  padding:8px 12px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s,transform .05s,opacity .15s;
}
button:hover{background:#dcd9d9}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.icon{width:38px;height:38px;padding:0}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:#0095cf}

.pos{color:var(--highlight-pos)}
.neg{color:var(--highlight-neg)}

/* ── Top bar ─────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:var(--gap);
  padding:var(--pad);border-bottom:1px solid var(--surface);
  position:sticky;top:0;background:var(--bg);z-index:10;
}
.topbar .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.topbar .brand b{font-size:var(--fs-xl);font-weight:var(--fw-bold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* ── Toolbar ─────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:8px;padding:var(--pad);flex-wrap:wrap}
.toggle-group{display:inline-flex;background:var(--surface);border-radius:var(--radius);padding:3px}
.toggle-group button{background:transparent;border-radius:6px;padding:6px 10px}
.toggle-group button.active{background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.toolbar .spacer{flex:1}

/* ── Ticker strip ────────────────────────── */
.ticker{
  position:fixed;left:0;right:0;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:6px;padding:6px var(--pad);
  background:var(--bg);border-top:1px solid var(--surface);z-index:9;
}
.ticker .cell{
  background:var(--surface);border-radius:var(--radius);
  padding:5px 8px;line-height:1.2;min-width:0;
  display:flex;flex-direction:column;gap:1px;
}
.ticker .cell .row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font:var(--fw-mid) var(--fs-s)/1 var(--font-mono)}
.ticker .cell .row1 .name{font:var(--fw-bold) var(--fs-xs) var(--font-sans);text-transform:uppercase;letter-spacing:.04em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker .cell .row2{font-size:var(--fs-xs);font-weight:var(--fw-light);opacity:.7;display:flex;justify-content:space-between;gap:6px}

/* ════════════════════════════════════════════════
   CARD VIEW
   ════════════════════════════════════════════════ */
.s-card{
  background:var(--surface);border-radius:var(--radius);
  padding:12px var(--pad);margin-bottom:var(--gap);
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-areas:"tk name trend" "meta meta meta" "stats stats stats" "why why why";
  gap:6px 10px;align-items:center;
}

/* — Header row — */
.s-card .tk    { grid-area:tk; font:var(--fw-mid) var(--fs-l)/1 var(--font-mono); letter-spacing:-.01em }
.s-card .name  { grid-area:name; font-size:var(--fs-s); font-weight:var(--fw-bold); overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
.s-card .trend { grid-area:trend; display:flex; align-items:center; gap:5px; font-size:var(--fs-xs); font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:.03em }

/* — Trend dot — */
.s-card .trend .dot         { width:8px; height:8px; border-radius:50%; display:inline-block }
.s-card .trend .dot.bull    { background:var(--highlight-pos) }
.s-card .trend .dot.bear    { background:var(--highlight-neg) }
.s-card .trend .dot.neutral { background:#E0B83A }

/* — Meta row — */
.s-card .meta        { grid-area:meta; display:flex; flex-wrap:wrap; gap:6px 14px; font-size:var(--fs-xs); font-weight:var(--fw-light); opacity:.8 }
.s-card .meta .exch  { font-weight:var(--fw-bold); opacity:1 }
.s-card .meta .price { font:var(--fw-mid) var(--fs-s) var(--font-mono); opacity:1 }
.s-card .meta .chg   { font:var(--fw-mid) var(--fs-xs) var(--font-mono) }

/* — Stats + Why: shared separator — */
.s-card .stats,
.s-card .why   { padding-top:6px; border-top:1px solid rgba(0,0,0,.06) }

/* — Stats grid — */
.s-card .stats           { grid-area:stats; display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:6px 10px }
.s-card .stats .k        { display:flex; flex-direction:column; gap:1px; line-height:1.2 }
.s-card .stats .k .lbl   { font-size:var(--fs-xs); font-weight:var(--fw-light); opacity:.6; text-transform:uppercase; letter-spacing:.04em }
.s-card .stats .k .v     { font:var(--fw-mid) var(--fs-xs) var(--font-mono) }

/* — Why row — */
.s-card .why   { grid-area:why; font-size:var(--fs-xs); font-weight:var(--fw-light); line-height:1.35; display:flex; flex-direction:column; gap:2px }
.s-card .why b { font-weight:var(--fw-bold) }

/* ════════════════════════════════════════════════
   TABLE VIEW
   ════════════════════════════════════════════════ */
.s-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch }
.s-table      { width:100%; border-collapse:collapse }

.s-table thead th {
  padding:8px 10px; text-align:left; text-transform:uppercase;
  font-size:var(--fs-xs); font-weight:var(--fw-light); letter-spacing:.04em;
  border-bottom:1px solid var(--surface); opacity:.7;
  cursor:pointer; user-select:none; white-space:nowrap;
}
.s-table thead th:hover { opacity:1 }
.s-table thead th .sort-icon { margin-left:4px; opacity:.4; font-style:normal }
.s-table thead th.sort-asc .sort-icon,
.s-table thead th.sort-desc .sort-icon { opacity:1 }

.s-table td { padding:6px; line-height:1.25; vertical-align:top; font-size:var(--fs-s) }
.s-table td.num { font:var(--fw-mid) var(--fs-s) var(--font-mono) }

/* rounded row corners */
.s-table tbody tr td:first-child { border-radius:var(--radius) 0 0 var(--radius) }
.s-table tbody tr td:last-child  { border-radius:0 var(--radius) var(--radius) 0 }

/* — Name cell — */
.s-table .t-name      { display:flex; flex-direction:column; gap:1px; min-width:0 }
.s-table .t-name .tk  { font:var(--fw-mid) var(--fs-s) var(--font-mono) }
.s-table .t-name .full{ font-size:var(--fs-xs); opacity:.65; max-width:80px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis }

/* — Two-line cell — */
.s-table .t-two      { display:flex; flex-direction:column; gap:1px }
.s-table .t-two .v   { font:var(--fw-mid) var(--fs-s) var(--font-mono) }
.s-table .t-two .sub { font-size:var(--fs-xs); opacity:.65 }

/* — Rating cell — */
.s-table .t-rtg          { display:flex; flex-direction:column; align-items:flex-end; gap:3px }
.s-table .t-rtg .bar     { position:relative; overflow:hidden; width:60px; height:6px; border-radius:3px; background:rgba(0,0,0,.08) }
.s-table .t-rtg .bar > i { position:absolute; inset:0; border-radius:3px; background:var(--accent) }

/* ════════════════════════════════════════════════
   BADGES  &  TAGS
   ════════════════════════════════════════════════ */
.badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:var(--fs-xs); font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:.04em; background:rgba(0,0,0,.08) }
.badge.pause              { opacity:.7 }
.badge.watch, .badge.mid  { background:#E0B83A33; color:#7A6118 }
.badge.active, .badge.lo  { background:#9BCF6333; color:#3F6B1F }
.badge.hi                 { background:#EF424222; color:#9B2828 }

.tag { display:inline-block; padding:1px 6px; border-radius:10px; font-size:var(--fs-xs); font-weight:var(--fw-mid); background:rgba(0,168,232,.12); color:#006a96 }

/* ── Frames ──────────────────────────────── */
.frame{padding:0 var(--pad) var(--pad)}
.frame[hidden]{display:none}
.card{background:var(--surface);border-radius:var(--radius);padding:var(--pad);margin-bottom:var(--gap)}

/* ── Tabs ────────────────────────────────── */
.tabs{display:flex;gap:6px;margin-bottom:var(--gap)}
.tabs button{flex:1;background:var(--surface)}
.tabs button.active{background:var(--accent);color:#fff}
.tabpanel[hidden]{display:none}

/* ── Bottom nav ──────────────────────────── */
.botnav{
  position:fixed;left:0;right:0;bottom:0;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding:8px var(--pad) calc(8px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--surface);
  display:flex;align-items:center;gap:var(--gap);z-index:10;
}
.botnav button.icon{background:var(--surface)}
.botnav .grow{flex:1}
.botnav select{
  width:100%;background:var(--surface);padding:10px 12px;border-radius:var(--radius);
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text) 50%),linear-gradient(135deg,var(--text) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;
}

/* ── Spinner ─────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
.spinning [data-lucide]{animation:spin .9s linear infinite}
[data-lucide]{width:18px;height:18px;stroke-width:2}
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════
     MARKUP — Top bar
     ════════════════════════════════════════════════ -->
<header class="topbar">
  <button id="menu-nav" class="icon" aria-label="Menu"><i data-lucide="menu"></i></button>

    <b id="brand-title">Screener</b>
  </div>
  <div class="actions">
    <button id="btn-json-import"><i data-lucide="upload"></i><span>Import</span></button>

  </div>
  <div class="tabpanel" id="tab-tax" hidden>
    <div class="card"><span style="font-size:var(--fs-xs);font-weight:var(--fw-light);text-transform:uppercase;letter-spacing:.04em;opacity:.7">Tax</span><div>Platzhalter — Tabelle realisierter Gewinne / Verluste</div></div>
  </div>
</section>

<aside class="ticker" id="ticker-strip">

<!-- ════════════════════════════════════════════════
     § 1  CONFIG
     ════════════════════════════════════════════════ -->
<script>
const CONFIG = {
  app:'screener', version:'0.1.0', storageKey:'screener.state.v1',
  api:{ twelvedata:{ base:'https://api.twelvedata.com', key:'' },
        yahoo:{ base:'https://query1.finance.yahoo.com', key:'' } },
  blob:{ endpoint:'/.netlify/functions/blob' }
};

/* ════════════════════════════════════════════════
   § 2  SCHEMA + localStorage
   ════════════════════════════════════════════════ */
const Schema = {
  state:{
    frame:'screener',           // 'screener' | 'portfolio'
    view:'card',                // 'card' | 'table'
    bucket:'portfolio',         // 'portfolio' | 'watchlist' | 'neutral'
    portfolioTab:'performance', // 'performance' | 'tax'
    sort:{ col:null, dir:1 }    // table sort state
  },
  data:{ indices:[], fx:{ usdEur:null }, holdings:[], alerts:[] }
};

const MOCK_ITEMS = [
  { ticker:'NVDA', name:'NVIDIA Corp',   exchange:'NASDAQ', sector:'Halbleiter / AI',    trend:'bull', trendLabel:'bullish', price:111.93, currency:'USD', changePct:-2.76, rsi:67, rsiLabel:'neutral',   macd:-0.53, range52w:56, alert:'<95',  entry:16,  alertState:'pause',  momentum:'hoch',   perf:597,  rating:0.92, tags:['AI','High'],       why:'AI Nachfrage + Datacenter Spend treiben Momentum.', next:'Q2 Earnings 14 May' },
  { ticker:'AIXA', name:'AIXTRON SE',    exchange:'XETRA',  sector:'Semiconductor Equip',trend:'neutral',trendLabel:'neutral',price:15.82,currency:'EUR', changePct: 1.18, rsi:49, rsiLabel:'watchlist', macd: 0.21, range52w:31, alert:'<14',  entry:16,  alertState:'active', momentum:'mittel', perf: -1.3,rating:0.55, tags:['Energy'],          why:'Nachfrage nach Leistungshalbleitern stabilisiert sich.', next:'Earnings 28 May' },
  { ticker:'ASML', name:'ASML Holding',  exchange:'AMS',    sector:'Lithography',        trend:'bull', trendLabel:'bullish', price:642.10, currency:'EUR', changePct: 0.84, rsi:58, rsiLabel:'neutral',   macd: 1.14, range52w:42, alert:'<600', entry:620, alertState:'active', momentum:'hoch',   perf: 21.5,rating:0.81, tags:['AI','EU'],         why:'EUV-Auftragslage robust, China-Risiko eingepreist.', next:'CMD 12 Jun' },
  { ticker:'EOAN', name:'E.ON SE',       exchange:'XETRA',  sector:'Versorger',          trend:'bear', trendLabel:'bearish', price: 11.46, currency:'EUR', changePct:-0.65, rsi:38, rsiLabel:'watchlist', macd:-0.08, range52w:18, alert:'>12',  entry:11,  alertState:'active', momentum:'niedrig',perf: -4.2,rating:0.41, tags:['Energy','Dividend'],why:'Regulatorik + Netzentgelt-Reform belasten Ausblick.', next:'Q1 Earnings 14 May' }
];

const Store = {
  load(){
    try{ const r = localStorage.getItem(CONFIG.storageKey); return r ? {...structuredClone(Schema),...JSON.parse(r)} : structuredClone(Schema); }
    catch(e){ return structuredClone(Schema); }
  },
  save(s){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(s)); }catch(e){} }
};
let STATE = Store.load();
if (!STATE.state.sort) STATE.state.sort = { col:null, dir:1 };

/* ════════════════════════════════════════════════
   § 3  DATA / API LAYER  (placeholder)
   ════════════════════════════════════════════════ */
// TODO: TwelveData + Yahoo Finance fetchers, normalization, caching

/* ════════════════════════════════════════════════
   § 4  BUSINESS LOGIC  (placeholder)
   ════════════════════════════════════════════════ */
// TODO: portfolio metrics, tax calc, screener filters, alerts evaluation

/* ════════════════════════════════════════════════
   § 5  RENDER
   ════════════════════════════════════════════════ */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>[...root.querySelectorAll(sel)];

const Render = {
  all(){ this.frame(); this.viewToggle(); this.tabs(); this.list(); },

  frame(){
    const s = STATE.state.frame;
    $('#frame-screener').hidden  = s !== 'screener';
    $('#frame-portfolio').hidden = s !== 'portfolio';
    $('#brand-title').textContent = s === 'portfolio' ? 'Portfolio' : 'Screener';
  },

  viewToggle(){
    const v = STATE.state.view;
    $('#btn-element-card-view').classList.toggle('active', v === 'card');
    $('#btn-element-table-view').classList.toggle('active', v === 'table');
    this.list();
  },

  tabs(){
    const t = STATE.state.portfolioTab;
    $$('.menu-nav-portfolio-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    $('#tab-performance').hidden = t !== 'performance';
    $('#tab-tax').hidden          = t !== 'tax';
  },

  list(){
    const host = $('#screener-list'); if (!host) return;
    host.innerHTML = STATE.state.view === 'table' ? this._table() : this._cards();
    if (window.lucide) lucide.createIcons();
    if (STATE.state.view === 'table') this._bindSort();
  },

  /* ── helpers ───────────────────────────────── */
  _fmtPct(p){ const s=p>0?'+':'', c=p>0?'pos':p<0?'neg':''; return `<span class="${c}">${s}${p.toFixed(2)} %</span>`; },
  _fmtPrice(p,cur){ return `${p.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} ${cur}`; },
  _dot(t){ return `<span class="dot ${t}"></span>`; },
  _alertBadge(s){ const m={active:['active','aktiv'],pause:['pause','pausiert'],neutral:['neutral','neutral']}; const [c,l]=m[s]||m.neutral; return `<span class="badge ${c}">${l}</span>`; },
  _momentumBadge(m){ const map={hoch:['hi','hoch'],mittel:['mid','mittel'],niedrig:['lo','niedrig']}; const [c,l]=map[m]||['neutral',m]; return `<span class="badge ${c}">${l}</span>`; },

  /* ── Card view ─────────────────────────────── */
  _cards(){
    return MOCK_ITEMS.map(it=>`
      <article class="s-card" data-ticker="${it.ticker}">
        <div class="tk">${it.ticker}</div>
        <div class="name">${it.name}</div>
        <div class="trend">${this._dot(it.trend)}${it.trendLabel}</div>
        <div class="meta">
          <span class="exch">${it.exchange}</span>
          <span>${it.sector}</span>
          <span class="price">${this._fmtPrice(it.price,it.currency)}</span>
          <span class="chg">${this._fmtPct(it.changePct)}</span>
        </div>
        <div class="stats">
          <div class="k"><span class="lbl">RSI</span><span class="v">${it.rsi} · ${it.rsiLabel}</span></div>
          <div class="k"><span class="lbl">MACD</span><span class="v">${it.macd>0?'+':''}${it.macd.toFixed(2)}</span></div>
          <div class="k"><span class="lbl">52W</span><span class="v">${it.range52w}%</span></div>
          <div class="k"><span class="lbl">Alert</span><span class="v">${it.alert} ${this._alertBadge(it.alertState)}</span></div>
          <div class="k"><span class="lbl">Entry</span><span class="v">${it.entry} €</span></div>
          <div class="k"><span class="lbl">Momentum</span><span class="v">${this._momentumBadge(it.momentum)}</span></div>
          <div class="k"><span class="lbl">Perf</span><span class="v ${it.perf>=0?'pos':'neg'}">${it.perf>=0?'+':''}${it.perf}%</span></div>
          <div class="k"><span class="lbl">Tags</span><span class="v">${it.tags.map(t=>`<span class="tag">${t}</span>`).join(' ')}</span></div>
        </div>
        <div class="why">
          <span><b>Why now:</b> ${it.why}</span>
          <span><b>Next:</b> ${it.next}</span>
        </div>
      </article>`).join('');
  },

  /* ── Table view ────────────────────────────── */
  _sortedItems(){
    const {col, dir} = STATE.state.sort;
    if (!col) return MOCK_ITEMS;
    return [...MOCK_ITEMS].sort((a,b)=>{
      const av = a[col], bv = b[col];
      return (typeof av === 'string' ? av.localeCompare(bv) : av - bv) * dir;
    });
  },

  _thClass(col){ const {col:c,dir:d} = STATE.state.sort; return c===col ? (d===1?'sort-asc':'sort-desc') : ''; },
  _thIcon(col) { const {col:c,dir:d} = STATE.state.sort; return c===col ? (d===1?'▲':'▼') : '▲'; },

  _table(){
    const cols = [
      { key:'ticker',    label:'Name' },
      { key:'exchange',  label:'Börse' },
      { key:'price',     label:'Preis',   cls:'num' },
      { key:'changePct', label:'Δ Tag',   cls:'num' },
      { key:'perf',      label:'Perf',    cls:'num' },
      { key:'rating',    label:'Rating',  cls:'num' }
    ];
    const ths = cols.map(c=>`<th data-col="${c.key}" class="${c.cls||''} ${this._thClass(c.key)}">${c.label} <i class="sort-icon">${this._thIcon(c.key)}</i></th>`).join('');
    const rows = this._sortedItems().map(it=>`
      <tr data-ticker="${it.ticker}">
        <td><div class="t-name"><span class="tk">${it.ticker}</span><span class="full">${it.name}</span></div></td>
        <td><div class="t-two"><span class="v">${it.exchange}</span><span class="sub">${it.sector}</span></div></td>
        <td class="num">${this._fmtPrice(it.price,it.currency)}</td>
        <td class="num">${this._fmtPct(it.changePct)}</td>
        <td class="num"><span class="${it.perf>=0?'pos':'neg'}">${it.perf>=0?'+':''}${it.perf}%</span></td>
        <td><div class="t-rtg">${this._dot(it.trend)}<div class="bar"><i style="width:${Math.round(it.rating*100)}%"></i></div></div></td>
      </tr>`).join('');
    return `<div class="s-table-wrap"><table class="s-table"><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>`;
  },

  _bindSort(){
    $$('.s-table thead th[data-col]').forEach(th=>{
      th.addEventListener('click',()=>{
        const col = th.dataset.col;
        const s = STATE.state.sort;
        STATE.state.sort = { col, dir: s.col === col ? -s.dir : 1 };
        Store.save(STATE);
        this.list();
      });
    });
  }
};

/* ════════════════════════════════════════════════
   § 6  EVENTS
   ════════════════════════════════════════════════ */
function bind(id, ev, fn){ const el=document.getElementById(id); if(!el){ console.warn('missing',id); return; } el.addEventListener(ev,fn); }
function setFrame(f){ STATE.state.frame=f; Store.save(STATE); Render.frame(); }

const Events = {
  init(){
    bind('menu-nav','click', ()=> setFrame(STATE.state.frame==='screener'?'portfolio':'screener'));
    bind('menu-nav-btn-screener','click', ()=> setFrame('screener'));
    bind('menu-nav-btn-portfolio','click', ()=> setFrame('portfolio'));

    bind('btn-json-import','click', ()=> console.log('[evt] import'));
    bind('btn-json-export','click', ()=> console.log('[evt] export'));
    bind('btn-blob','click', e=>{ const b=e.currentTarget; b.classList.add('spinning'); setTimeout(()=>b.classList.remove('spinning'),1200); });
    bind('btn-config','click', ()=> console.log('[evt] config'));

    bind('btn-element-card-view','click',  ()=>{ STATE.state.view='card';  Store.save(STATE); Render.viewToggle(); });
    bind('btn-element-table-view','click', ()=>{ STATE.state.view='table'; Store.save(STATE); Render.viewToggle(); });
    bind('btn-element-refresh','click',     ()=> console.log('[evt] refresh'));
    bind('btn-element-fullrefresh','click', ()=> console.log('[evt] full-refresh'));

    $$('.menu-nav-portfolio-tab').forEach(btn=>{
      btn.addEventListener('click',()=>{ STATE.state.portfolioTab=btn.dataset.tab; Store.save(STATE); Render.tabs(); });
    });

    bind('nav-bottom-element-home','click',  ()=> setFrame('screener'));
    bind('nav-bottom-element-alert','click', ()=> console.log('[evt] alerts'));
    bind('nav-bottom-element-dropdown','change', e=>{ STATE.state.bucket=e.target.value; Store.save(STATE); });
  }
};

/* ════════════════════════════════════════════════
   § 7  INIT
   ════════════════════════════════════════════════ */
function init(){
  Events.init();
  $('#nav-bottom-element-dropdown').value = STATE.state.bucket;
  Render.all();
  if (window.lucide) lucide.createIcons();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
